<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>UberEatsCUDEC</title>
  <link type="text/css" href="/css/materialize.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link type="text/css" href="/css/styles.css" rel="stylesheet">
  <script type="text/javascript" src="/js/materialize.min.js"></script>
</head>
<body class="grey lighten-4">

  <nav class="z-depth-0">
    <div class="nav-wrapper container">
      <a href="/index.html">UberEats<span>CUDEC</span></a>
      <span class="right grey-text text-darken-1">
        <i class="material-icons sidenav-trigger" data-target="side-menu">menu</i>
      </span>
    </div>
  </nav>

  <ul id="side-menu" class="sidenav side-menu">
    <li><a class="subheader">UberEatsCUDEC</a></li>
    <li><a href="/index.html" class="waves-effect">Inicio</a></li>
    <li><a href="/pages/about.html" class="waves-effect">Acerca</a></li>
    <li><div class="divider"></div></li>
    <li><a href="/pages/pedidos.html" class="waves-effect">
      <i class="material-icons">mail_outline</i>Contacto</a>
    </li>
  </ul>

  <div class="container grey-text">
    <div class="card-panel white" style="margin-top: 20px; border-radius: 8px;">
      
      <form class="add-order section">
        <h5 class="black-text">Nuevo Pedido</h5>
        <div class="divider" style="margin-bottom: 20px;"></div>

        <div class="input-field">
          <select id="listaPlatillo">
            <option value="" disabled selected>Elige un platillo</option>
          </select>
          <label style="font-size: 1.1rem; color: #000;">Platillo</label>
        </div>

        <div class="input-field" style="margin-top: 30px;">
          <input id="nombre-cliente" type="text" class="validate">
          <label for="nombre-cliente" style="font-size: 1.1rem; color: #000;">Nombre</label>
        </div>

        <div class="input-field" style="margin-top: 30px;">
          <textarea id="direccion-cliente" class="materialize-textarea"></textarea>
          <label for="direccion-cliente" style="font-size: 1.1rem; color: #000;">Dirección</label>
        </div>

        <div class="input-field right-align" style="margin-top: 20px;">
          <a href="/index.html" class="btn-flat waves-effect" style="margin-right: 10px;">Cancelar</a>
          <button type="submit" class="btn orange darken-2 waves-effect waves-light">Guardar</button>
        </div>
      </form>

      <div class="left-align" style="margin-top: 10px;">
        <button type="button" id="btnUbicacion" class="btn blue darken-2 waves-effect waves-light">
          <i class="material-icons left">my_location</i>Ubicación
        </button>
      </div>

    </div>
  </div>
  
  <script src="https://www.gstatic.com/firebasejs/6.0.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/6.0.1/firebase-firestore.js"></script>

  <script src="../js/firebase.js"></script>

  <script src="../js/db.js"></script>
  <script src="../js/pedidos.js"></script>
  <script src="../js/index.js"></script>
  <script src="../js/ui.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Inicializar menús laterales
      var sideNavs = document.querySelectorAll('.sidenav');
      M.Sidenav.init(sideNavs);
      
      // Inicializar el select de Materialize por primera vez
      var selects = document.querySelectorAll('select');
      M.FormSelect.init(selects);
    });
  </script>
</body>
</html>
