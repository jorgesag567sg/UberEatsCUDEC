<body class="grey lighten-4">

  <!-- Barra de navegación -->
  <nav class="z-depth-0">
    <div class="nav-wrapper container">
      <a href="../index.html">UberEats<span>CUDEC</span></a>

  <!-- Menú lateral -->

    <li><a class="subheader">UberEatsCUDEC</a></li>

    <li><a href="pedidos.html" class="waves-effect">
      <i class="material-icons">shopping_cart</i>Pedidos</a>
    </li>
  </ul>

  <!-- Formulario -->
  <div class="container grey-text">
    <div class="card-panel white" style="margin-top: 20px; border-radius: 8px;">
      
      <form class="add-order section">
        <h5 class="black-text">Nuevo Pedido</h5>
        <div class="divider" style="margin-bottom: 20px;"></div>

        <div class="input-field">
          <select id="listaPlatillo">
            <option value="" disabled selected>Elige un platillo</option>
          </select>
          <label style="font-size: 1.1rem; color: #000;">Platillo</label>
        </div>

        <div class="input-field" style="margin-top: 30px;">
          <input id="nombre-cliente" type="text" class="validate">
          <label for="nombre-cliente" style="font-size: 1.1rem; color: #000;">Nombre</label>
        </div>

        <div class="input-field" style="margin-top: 30px;">
          <textarea id="direccion-cliente" class="materialize-textarea" placeholder="Ej: Avenida Atlacomulco, Tlalnepantla"></textarea>
          <label for="direccion-cliente" style="font-size: 1.1rem; color: #000;">Dirección</label>
        </div>

        <div class="input-field right-align" style="margin-top: 20px;">
          <a href="../index.html" class="btn-flat waves-effect" style="margin-right: 10px;">Cancelar</a>
          <button type="submit" class="btn orange darken-2 waves-effect waves-light">Guardar</button>
        </div>
      </form>

      <div class="left-align" style="margin-top: 10px;">
        <button type="button" id="btnUbicacion" class="btn blue darken-2 waves-effect waves-light">
          <i class="material-icons left">search</i>Buscar Dirección en Mapa
        </button>
      </div>

      <div id="mapa"></div>

    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {

      var selects = document.querySelectorAll('select');
      M.FormSelect.init(selects);
