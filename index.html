  <div class="recipes container grey-text text-darken-1">
    
  </div>

  <div class="center">
    <a class="btn-floating btn-small btn-large add-btn sidenav-trigger" data-target="side-form">
      <i class="material-icons">add</i>
    </a>
  </div>

  <div id="side-form" class="sidenav side-form">
    <form class="add-recipe container section">
      <h6>Nuevo platillo</h6>
      <div class="divider"></div>
      <div class="input-field">
        <input placeholder="ejemplo: Pizza" id="title" type="text" class="validate">
        <label for="title">Nombre</label>
      </div>
      <div class="input-field">
        <input placeholder="e.g. Tofu, mushroom, garlic" id="ingredients" type="text" class="validate">
        <label for="ingredients">Ingredientes</label>
      </div>
      <input id="foto" type="hidden">
      <div class="input-field">
        <input placeholder="ejemplo: 95" id="price" type="text" class="validate">
        <label for="price">Precio</label>
      </div>

      <div class="input-field center">
        <button type="submit" id="btnAgregarPlatillo" class="btn-small orange darken-2">Agregar</button>
      </div>
    </form>

    <div class="container section">
      <div class="divider" style="margin-bottom: 15px;"></div>
      
      <button id="btnFoto" class="btn-small blue darken-2" style="width: 100%; margin-bottom: 10px;">
        <i class="material-icons left">videocam</i>Iniciar Cámara
      </button>
      
      <div id="camara">
          <video id="video">No hay video disponible</video>
      </div>
      
      <button onclick="tomarFoto()" class="btn-small green darken-2" style="width: 100%; margin-top: 10px;">
        <i class="material-icons left">camera_alt</i>Capturar Foto
      </button>

      <canvas id="canvas"></canvas>
      
      <div id="salida" style="margin-top: 15px;">
        <img id="foto-vista" src="" alt="Vista previa de captura">
      </div>

      <button onclick="limpiarFoto()" class="btn-small grey darken-1" style="width: 100%; margin-top: 10px; margin-bottom: 30px;">
        <i class="material-icons left">delete_sweep</i>Limpiar Foto
      </button>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/6.0.1/firebase-app.js"></script>
